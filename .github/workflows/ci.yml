name: CI

# Brief §14: install → lint → type-check → tests → build → performance budget.
on:
  push:
    branches: [main]
  pull_request:

# Newer pushes on the same branch supersede in-flight runs (saves minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Typecheck · Test · Build budget
    runs-on: ubuntu-latest
    env:
      # `src/lib/env.ts` validates these at import (fails fast) — a well-formed
      # URL and a ≥16-char secret satisfy the schema. No live DB is needed: the
      # build's only DB touch is a best-effort locale-overrides lookup that
      # `i18n/request.ts` catches, so the build stays green (you may see harmless
      # "Can't reach database" lines). Add a Postgres service here when API
      # integration tests (brief §13) land.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-placeholder-secret-not-used-anywhere
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Production build + Rule 7 3G JS-weight budget in one step (perf:budget
      # runs `next build` and fails if the shared/route First-Load JS regresses).
      - name: Build & performance budget
        run: npm run perf:budget
